{% for key, value in entries.sorted_items() %}
<div class="ms-entry">
  {% if value.url %}
    {% set icon %}<a class="mdi mdi-earth" href="{{ value.url }}" target="_blank"></a>{% endset %}
    {{ value.html | append_to_last_p(icon) }}
  {% else %}
    {{ value.html }}
  {% endif %}
</div>
{% endfor %}
